<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome ItzFizz – Scroll Hero</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root { --bg:#0b0d10; --fg:#f2f4f7; --muted:#8b93a1; --accent:#c6ff3d; --road:#1a1e24; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: system-ui, "Helvetica Neue", Arial, sans-serif; }
  .hero { height: 100vh; height: 100svh; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: env(safe-area-inset-top, 0px); }
  .headline { margin-top: 12vh; font-size: clamp(1.4rem, 5.2vw, 4.2rem); font-weight: 700; letter-spacing: .55em; text-align: center; padding-left: .55em; will-change: transform, opacity; }
  .headline .ch { display: inline-block; will-change: transform, opacity; }
  .headline .sp { display: inline-block; width: .5em; }
  .stats { display: flex; gap: clamp(1.5rem, 6vw, 5rem); margin-top: 6vh; padding: 0 1rem; flex-wrap: wrap; justify-content: center; }
  .stat { text-align: center; max-width: 12rem; }
  .stat b { display: block; font-size: clamp(2rem, 5vw, 3.5rem); color: var(--accent); }
  .stat span { font-size: .85rem; color: var(--muted); }
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 22vh; background: linear-gradient(var(--road), var(--bg)); border-top: 1px solid #262b33; }
  .car { position: absolute; bottom: 12vh; left: 50%; width: min(46vw, 520px); min-width: 240px; margin-left: calc(min(46vw, 520px) / -2); will-change: transform; }
  .car svg { width: 100%; height: auto; display: block; overflow: visible; }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .next { min-height: 100vh; display: grid; place-items: center; padding: 4rem 1.5rem; text-align: center; color: var(--muted); font-size: 1.2rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <h1 class="headline" id="headline" aria-label="Welcome ItzFizz">WELCOME ITZ FIZZ</h1>
  <div class="stats">
    <div class="stat"><b>98%</b><span>Customer satisfaction across all deliveries</span></div>
    <div class="stat"><b>3x</b><span>Faster performance versus the industry</span></div>
    <div class="stat"><b>45%</b><span>Lower running costs for every client</span></div>
  </div>
  <div class="road"></div>
  <div class="car" id="car">
    <svg viewBox="0 0 520 190" aria-hidden="true">
      <path d="M20 135 L40 100 Q50 88 80 84 L160 78 Q200 30 270 30 L350 34 Q400 40 430 80 L480 92 Q505 100 505 125 L505 140 L20 140Z" fill="#e9edf2"/>
      <path d="M185 78 Q215 46 270 46 L335 48 Q372 54 395 80Z" fill="#1c2733"/>
      <rect x="20" y="120" width="485" height="8" fill="var(--accent)"/>
      <g class="wheel" id="w1"><circle cx="125" cy="145" r="38" fill="#0e1114"/><circle cx="125" cy="145" r="20" fill="#9aa3af"/><path d="M125 127v36M107 145h36" stroke="#0e1114" stroke-width="5"/></g>
      <g class="wheel" id="w2"><circle cx="395" cy="145" r="38" fill="#0e1114"/><circle cx="395" cy="145" r="20" fill="#9aa3af"/><path d="M395 127v36M377 145h36" stroke="#0e1114" stroke-width="5"/></g>
    </svg>
  </div>
</section>
<section class="next">Scroll finished — the next section begins here.</section>

<script>
  gsap.registerPlugin(ScrollTrigger);

  // Split headline into letters for a staggered reveal
  const h = document.getElementById("headline");
  const text = h.textContent;
  h.textContent = "";
  [...text].forEach(c => {
    const s = document.createElement("span");
    s.className = c === " " ? "sp" : "ch";
    s.setAttribute("aria-hidden", "true");
    s.textContent = c === " " ? "" : c;
    h.appendChild(s);
  });

  // 1. Intro animation (time-based, runs once on load)
  const intro = gsap.timeline({ defaults: { ease: "power3.out" } });
  intro
    .from(".headline .ch", { y: 40, opacity: 0, duration: 1, stagger: 0.05 })
    .from(".stat", { y: 30, opacity: 0, duration: 0.9, stagger: 0.25 }, "-=0.4")
    .from("#car", { y: 60, opacity: 0, duration: 1.1 }, "-=0.9");

  // 2. Scroll animation (progress-based, smoothed with scrub)
  const mm = gsap.matchMedia();
  mm.add("(prefers-reduced-motion: no-preference)", () => {
    const vw = () => window.innerWidth;
    const tl = gsap.timeline({
      defaults: { ease: "none" },
      scrollTrigger: {
        trigger: "#hero",
        start: "top top",
        end: "+=200%",
        pin: true,
        scrub: 1.2,          // interpolates toward scroll position for fluid motion
        invalidateOnRefresh: true
      }
    });

    tl.fromTo("#car", { x: () => -vw() * 0.5, scale: 0.85 },
                      { x: () => vw() * 0.5, scale: 1.15, rotation: -1.5 }, 0)
      .to("#w1, #w2", { rotation: 720 }, 0)
      .to(".headline", { y: -60, opacity: 0.25, letterSpacing: "0.8em" }, 0)
      .to(".stat", { y: 40, opacity: 0, stagger: 0.1 }, 0.4);
  });
</script>
</body>
</html>
